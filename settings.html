<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理系统</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="settings" data-page-title="系统设置">
<div class="layout-side" id="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">
      <div class="multi-tabs">
        <a class="multi-tab active" href="settings.html">系统设置<button class="tab-close" type="button" aria-label="关闭">×</button></a>
      </div>
      <div class="card config-card">
        <div class="config-layout">
          <div class="config-sidebar">
            <div class="config-sidebar-item active" data-panel="login">登录方式</div>
            <div class="config-sidebar-item" data-panel="password">密码策略</div>
            <div class="config-sidebar-item" data-panel="basic">基本信息</div>
          </div>
          <div class="config-content">
            <div class="config-panel active" id="panel-login">
              <div class="config-section-title">登录方式</div>
              <p class="config-hint">账号密码登录保持开启。验证码开关会作用到登录页和忘记密码页。</p>
              <div class="form-item switch-row"><span>账号密码登录</span><button class="switch on" id="switch-account" type="button" disabled aria-pressed="true"></button></div>
              <div class="form-item switch-row"><span>图形验证码</span><button class="switch" id="switch-captcha" type="button" data-toggle aria-pressed="false"></button></div>
              <div class="form-item"><label class="form-label" for="lock-after">连续失败锁定次数</label><input class="input" id="lock-after" type="number" min="1" max="20" style="max-width:160px"></div>
            </div>
            <div class="config-panel" id="panel-password">
              <div class="config-section-title">密码策略</div>
              <div class="form-item"><label class="form-label" for="password-min">最少位数</label><input class="input" id="password-min" type="number" min="6" max="32" style="max-width:160px"></div>
              <div class="form-item switch-row"><span>须包含字母和数字</span><button class="switch" id="switch-mixed" type="button" data-toggle aria-pressed="false"></button></div>
              <div class="form-item switch-row"><span>首次登录必须修改密码</span><button class="switch" id="switch-must-change" type="button" data-toggle aria-pressed="false"></button></div>
              <div class="form-item"><label class="form-label" for="password-hint">密码说明</label><input class="input" id="password-hint" maxlength="80"></div>
            </div>
            <div class="config-panel" id="panel-basic">
              <div class="config-section-title">基本信息</div>
              <p class="config-hint">系统名称和标识的正式配置在 js/brand.js。这里只演示设置页的字段。</p>
              <div class="form-item"><label class="form-label" for="system-name">系统名称</label><input class="input" id="system-name" maxlength="32"></div>
            </div>
            <div class="save-bar" style="display:flex;gap:12px;align-items:center;padding:0 24px 24px;">
              <button class="btn btn-primary" id="settings-save" type="button">保存</button>
              <div class="config-feedback ok" id="settings-feedback" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/brand.js"></script>
<script src="js/settings-data.js"></script>
<script src="js/chrome.js"></script>
<script src="js/shell.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
