<!DOCTYPE html>
<!-- 首次登录修改密码页。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理系统</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body" data-page-title="修改密码">
<main class="login-page">
  <div class="login-card">
    <div class="login-mark"><span class="brand-mark" data-brand-mark></span></div>
    <h1 class="login-title">修改密码</h1>
    <p class="pwd-sub" id="change-tip">当前账号需先修改密码后才能继续使用。</p>
    <form class="login-form" onsubmit="return submitChange(event)">
      <div class="form-item">
        <label class="form-label" for="old-password">当前密码</label>
        <div class="input-group pwd-group"><input class="input" id="old-password" type="password" required autocomplete="current-password"><button class="pwd-toggle" type="button" aria-label="显示密码"><svg class="eye-open" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 8S3.8 4.2 8 4.2 14.5 8 14.5 8 12.2 11.8 8 11.8 1.5 8 1.5 8Z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.4"/></svg><svg class="eye-off" width="16" height="16" viewBox="0 0 16 16" fill="none" hidden><path d="M2.2 2.2l11.6 11.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></div>
      </div>
      <div class="form-item">
        <label class="form-label" for="new-password">新密码</label>
        <div class="input-group pwd-group"><input class="input" id="new-password" type="password" required autocomplete="new-password"><button class="pwd-toggle" type="button" aria-label="显示密码"><svg class="eye-open" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 8S3.8 4.2 8 4.2 14.5 8 14.5 8 12.2 11.8 8 11.8 1.5 8 1.5 8Z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.4"/></svg><svg class="eye-off" width="16" height="16" viewBox="0 0 16 16" fill="none" hidden><path d="M2.2 2.2l11.6 11.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></div>
      </div>
      <div class="form-item">
        <label class="form-label" for="confirm-password">确认新密码</label>
        <div class="input-group pwd-group"><input class="input" id="confirm-password" type="password" required autocomplete="new-password"><button class="pwd-toggle" type="button" aria-label="显示密码"><svg class="eye-open" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 8S3.8 4.2 8 4.2 14.5 8 14.5 8 12.2 11.8 8 11.8 1.5 8 1.5 8Z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.4"/></svg><svg class="eye-off" width="16" height="16" viewBox="0 0 16 16" fill="none" hidden><path d="M2.2 2.2l11.6 11.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></div>
      </div>
      <div class="login-error" id="change-error" hidden></div>
      <button class="btn btn-primary login-btn" type="submit">确认修改</button>
    </form>
    <a class="pwd-logout" href="login.html">退出登录</a>
  </div>
</main>
<script src="js/brand.js"></script>
<script src="js/settings-data.js"></script>
<script src="js/shell.js"></script>
<script>
  var settings = readSettings();
  if (settings.passwordHint) document.getElementById("change-tip").textContent = "当前账号需先修改密码后才能继续使用。" + settings.passwordHint;
  function submitChange(event) {
    event.preventDefault();
    var error = document.getElementById("change-error");
    var created = document.getElementById("new-password").value;
    var confirm = document.getElementById("confirm-password").value;
    if (!document.getElementById("old-password").value || created.length < settings.passwordMin || created !== confirm) {
      error.hidden = false;
      error.textContent = "请填写当前密码，并按密码说明确认新密码";
      return false;
    }
    window.location.href = "login.html";
    return false;
  }
</script>
</body>
</html>
