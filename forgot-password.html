<!DOCTYPE html>
<!-- 忘记密码页。先验证账号，再设置新密码。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理系统</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body" data-page-title="忘记密码">
<main class="login-page">
  <div class="login-card">
    <div class="login-mark"><span class="brand-mark" data-brand-mark></span></div>
    <h1 class="login-title">忘记密码</h1>
    <p class="pwd-sub" id="forgot-tip">验证账号后设置新密码。</p>
    <form class="login-form" id="forgot-form" onsubmit="return submitForgot(event)">
      <div id="forgot-step-account">
        <div class="form-item">
          <label class="form-label" for="username">登录账号</label>
          <input class="input" id="username" required autocomplete="username">
        </div>
        <div class="form-item" id="captcha-item">
          <label class="form-label" for="captcha">验证码</label>
          <div class="captcha-row"><input class="input" id="captcha" maxlength="8" autocomplete="off"><div class="captcha-box" aria-hidden="true">4K7M</div></div>
        </div>
      </div>
      <div id="forgot-step-password" hidden>
        <div class="form-item"><label class="form-label" for="new-password">新密码</label><input class="input" id="new-password" type="password" autocomplete="new-password"></div>
        <div class="form-item"><label class="form-label" for="confirm-password">确认新密码</label><input class="input" id="confirm-password" type="password" autocomplete="new-password"></div>
      </div>
      <div class="login-error" id="forgot-error" hidden></div>
      <button class="btn btn-primary login-btn" type="submit" id="forgot-submit">下一步</button>
    </form>
    <a class="pwd-logout" href="login.html">返回登录</a>
  </div>
</main>
<script src="js/brand.js"></script>
<script src="js/settings-data.js"></script>
<script src="js/shell.js"></script>
<script>
  var step = "account";
  var settings = readSettings();
  if (!settings.captcha) document.getElementById("captcha-item").hidden = true;
  document.getElementById("forgot-tip").textContent = settings.passwordHint || "验证账号后设置新密码。";
  function submitForgot(event) {
    event.preventDefault();
    var error = document.getElementById("forgot-error");
    error.hidden = true;
    if (step === "account") {
      if (!document.getElementById("username").value.trim()) return false;
      if (settings.captcha && !document.getElementById("captcha").value.trim()) {
        error.hidden = false;
        error.textContent = "请填写验证码";
        return false;
      }
      step = "password";
      document.getElementById("forgot-step-account").hidden = true;
      document.getElementById("forgot-step-password").hidden = false;
      document.getElementById("forgot-submit").textContent = "确认修改";
      return false;
    }
    var created = document.getElementById("new-password").value;
    var confirm = document.getElementById("confirm-password").value;
    if (created.length < settings.passwordMin || created !== confirm) {
      error.hidden = false;
      error.textContent = "请按密码说明填写，并保证两次输入一致";
      return false;
    }
    error.hidden = false;
    error.className = "login-ok";
    error.textContent = "界面示例，未连接账号服务";
    return false;
  }
</script>
</body>
</html>
