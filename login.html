<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理系统</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body" data-page-title="登录">
<main class="login-page">
  <div class="login-card">
    <div class="login-mark"><span class="brand-mark" data-brand-mark></span></div>
    <h1 class="login-title" data-brand-name></h1>
    <form class="login-form" action="index.html">
      <div class="form-item">
        <label class="form-label" for="username">登录账号</label>
        <div class="input-group">
          <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.2" r="2.4" stroke="currentColor" stroke-width="1.4"/><path d="M3.2 13.2c.6-2.2 2.4-3.3 4.8-3.3s4.2 1.1 4.8 3.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
          <input class="input" id="username" type="text" required autocomplete="username">
        </div>
      </div>
      <div class="form-item">
        <label class="form-label" for="password">登录密码</label>
        <div class="input-group pwd-group">
          <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3.2" y="7" width="9.6" height="6.2" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M5.4 7V5.2a2.6 2.6 0 0 1 5.2 0V7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
          <input class="input" id="password" type="password" required autocomplete="current-password">
          <button class="pwd-toggle" id="pwd-toggle" type="button" aria-label="显示密码">
            <svg class="eye-open" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 8S3.8 4.2 8 4.2 14.5 8 14.5 8 12.2 11.8 8 11.8 1.5 8 1.5 8Z" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.4"/></svg>
            <svg class="eye-off" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden><path d="M2.2 2.2l11.6 11.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6.3 4.6A6.8 6.8 0 0 1 8 4.2C12.2 4.2 14.5 8 14.5 8a12 12 0 0 1-2.1 2.6M3.4 5.5C2.2 6.5 1.5 8 1.5 8S3.8 11.8 8 11.8c.7 0 1.3-.1 1.9-.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="form-item" id="captcha-item">
        <label class="form-label" for="captcha">验证码</label>
        <div class="captcha-row">
          <input class="input" id="captcha" type="text" required maxlength="8" autocomplete="off">
          <div class="captcha-box" aria-hidden="true">4K7M</div>
        </div>
      </div>
      <div class="login-extra"><a href="forgot-password.html">忘记密码</a></div>
      <button class="btn btn-primary login-btn" type="submit">登录</button>
    </form>
  </div>
</main>
<script src="js/brand.js"></script>
<script src="js/settings-data.js"></script>
<script src="js/shell.js"></script>
<script>
  if (!readSettings().captcha) {
    var captchaItem = document.getElementById("captcha-item");
    captchaItem.hidden = true;
    captchaItem.querySelector("input").required = false;
  }
</script>
</body>
</html>
