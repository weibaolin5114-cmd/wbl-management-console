<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理系统</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body data-page="form" data-page-title="表单">
<div class="layout-side" id="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content">
      <div class="multi-tabs">
        <a class="multi-tab" href="list.html">列表<button class="tab-close" type="button" aria-label="关闭">×</button></a>
        <a class="multi-tab active" href="form.html">表单<button class="tab-close" type="button" aria-label="关闭">×</button></a>
      </div>
      <div class="card" style="max-width:800px">
        <div class="card-header"><span class="card-title">新增记录</span></div>
        <form action="list.html">
          <div class="form-grid">
            <div class="form-item">
              <label class="form-label"><span class="required">*</span>名称</label>
              <input class="input" type="text" required placeholder="请输入名称">
            </div>
            <div class="form-item">
              <label class="form-label"><span class="required">*</span>分类</label>
              <select class="select" required><option value="">请选择</option><option>分类甲</option><option>分类乙</option><option>分类丙</option></select>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-item">
              <label class="form-label">日期</label>
              <input class="input" type="date">
            </div>
            <div class="form-item">
              <label class="form-label">状态</label>
              <select class="select"><option>启用</option><option>停用</option><option>草稿</option></select>
            </div>
          </div>
          <div class="form-item">
            <label class="form-label">说明</label>
            <textarea class="textarea" placeholder="请输入说明"></textarea>
            <div class="form-hint">选填，用于补充这条记录的说明。</div>
          </div>
          <div class="form-actions">
            <a class="btn" href="list.html">取消</a>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="js/brand.js"></script>
<script src="js/chrome.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
