<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理系统</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
</head>
<body data-page-title="概览">
<div class="layout-side" id="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="brand-mark" data-brand-mark></span>
      <span class="sidebar-logo-text" data-brand-name></span>
    </div>
    <nav class="sidebar-menu">
      <a class="menu-item active" href="index.html">
        <svg class="menu-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2.2" y="2.2" width="5.6" height="5.6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="10.2" y="2.2" width="5.6" height="5.6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="2.2" y="10.2" width="5.6" height="5.6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="10.2" y="10.2" width="5.6" height="5.6" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="menu-label">概览</span>
      </a>
      <a class="menu-item" href="list.html">
        <svg class="menu-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 4.5h10M4 9h10M4 13.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="menu-label">列表</span>
      </a>
      <a class="menu-item" href="form.html">
        <svg class="menu-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5 2.5h5.2L14 6.2V15.5H5V2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 2.8V6.2h3.2M7 9.2h4M7 12h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="menu-label">表单</span>
      </a>
      <a class="menu-item" href="detail.html">
        <svg class="menu-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="1.4" stroke="currentColor" stroke-width="1.4"/><path d="M6 7h6M6 10h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="menu-label">详情</span>
      </a>
    </nav>
  </aside>
  <div class="main">
    <header class="header">
      <button class="collapse-btn" type="button" onclick="toggleSidebar()" aria-label="收起侧栏">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 4.5h12M3 9h12M3 13.5h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="header-right">
        <div class="dropdown" id="userDropdown">
          <div class="header-user" onclick="toggleDropdown('userDropdown')">
            <div class="header-avatar" data-brand-avatar></div>
            <span data-brand-user></span>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="dropdown-menu">
            <div class="dropdown-item" onclick="openPasswordModal()">修改密码</div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item danger" onclick="openModal('logout-modal')">退出登录</div>
          </div>
        </div>
      </div>
    </header>
    <div class="content">
      <div class="multi-tabs">
        <a class="multi-tab active" href="index.html">概览<button class="tab-close" type="button" aria-label="关闭">×</button></a>
        <a class="multi-tab" href="list.html">列表<button class="tab-close" type="button" aria-label="关闭">×</button></a>
      </div>
      <div class="stat-cards">
        <div class="stat-card"><div class="stat-card-label">指标一</div><div class="stat-card-value">128</div></div>
        <div class="stat-card"><div class="stat-card-label">指标二</div><div class="stat-card-value">36</div></div>
        <div class="stat-card"><div class="stat-card-label">指标三</div><div class="stat-card-value">12</div></div>
        <div class="stat-card"><div class="stat-card-label">指标四</div><div class="stat-card-value">7</div></div>
      </div>
      <div class="dashboard-row">
        <div class="card">
          <div class="card-header"><span class="card-title">分类占比</span></div>
          <div class="bar-row"><span class="bar-label">分类甲</span><div class="bar-track"><div class="bar-fill" style="width:72%">72</div></div></div>
          <div class="bar-row"><span class="bar-label">分类乙</span><div class="bar-track"><div class="bar-fill" style="width:48%">48</div></div></div>
          <div class="bar-row"><span class="bar-label">分类丙</span><div class="bar-track"><div class="bar-fill" style="width:26%">26</div></div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">最近记录</span>
            <a class="btn btn-text btn-sm" href="list.html">查看全部</a>
          </div>
          <table class="table">
            <thead><tr><th>名称</th><th>分类</th><th>状态</th><th>时间</th></tr></thead>
            <tbody>
              <tr><td>示例一</td><td>分类甲</td><td><span class="tag tag-success">启用</span></td><td>2026-10-20</td></tr>
              <tr><td>示例二</td><td>分类乙</td><td><span class="tag tag-warning">待处理</span></td><td>2026-10-18</td></tr>
              <tr><td>示例三</td><td>分类丙</td><td><span class="tag">草稿</span></td><td>2026-10-16</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="logout-modal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">退出登录</span><button class="modal-close" type="button" onclick="closeModal('logout-modal')" aria-label="关闭">×</button></div>
    <div class="modal-body">确定退出当前账号吗？</div>
    <div class="modal-footer">
      <button class="btn" type="button" onclick="closeModal('logout-modal')">取消</button>
      <a class="btn btn-primary" href="login.html">退出登录</a>
    </div>
  </div>
</div>
<div id="password-modal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">修改密码</span><button class="modal-close" type="button" onclick="closeModal('password-modal')" aria-label="关闭">×</button></div>
    <div class="modal-body">
      <div id="password-step-old">
        <div class="form-item" style="margin-bottom:0"><label class="form-label" for="pwd-old">当前密码</label><input class="input" id="pwd-old" type="password" autocomplete="current-password"></div>
      </div>
      <div id="password-step-new" hidden>
        <div class="form-item"><label class="form-label" for="pwd-new">新密码</label><input class="input" id="pwd-new" type="password" autocomplete="new-password"></div>
        <div class="form-item" style="margin-bottom:0"><label class="form-label" for="pwd-confirm">确认新密码</label><input class="input" id="pwd-confirm" type="password" autocomplete="new-password"></div>
      </div>
      <div class="form-error" id="password-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" type="button" onclick="closeModal('password-modal')">取消</button>
      <button class="btn btn-primary" type="button" id="password-next" onclick="verifyOldPassword()">下一步</button>
      <button class="btn btn-primary" type="button" id="password-save" onclick="submitNewPassword()" hidden>确认修改</button>
    </div>
  </div>
</div>
<script src="js/brand.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
